# 一键起「后端六个服务 + 四条 arq 流水线 + OpenSandbox 沙箱 + 前端」。
#
# MySQL / Redis / Nacos 不在这里：中台的业务配置全部存在 Nacos（data_id = 服务名，
# 见 sql/init_nacos.yaml），库里还得先执行 sql/v2_init.sql 建表灌种子。
# 所以起之前提是这三样已经就绪，NACOS_ADDR 指向它。
#
#   cd docker
#   NACOS_ADDR=10.0.0.9:8848 docker compose up -d --build
#
# 常用覆盖：WORKERS（每个服务的 gunicorn worker 数）、ARQ_WORKERS、RAG_ARQ_WORKERS、
#           GRAPH_ARQ_WORKERS、HARNESS_ARQ_WORKERS、SPLIT_NUMBER、RAG_SPLIT_NUMBER、
#           GRAPH_SPLIT_NUMBER、HARNESS_SPLIT_NUMBER、TAG、UI_PORT、OPENSANDBOX_PORT

name: dragon-ai

x-backend: &backend
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: dragon-ai-backend:${TAG:-latest}
  networks:
    - dragon-ai
  # init=true：信号由 tini 代收再转给脚本，否则 docker stop 时 worker 会被直接打死
  init: true
  restart: unless-stopped
  # 日志一律走 stdout/stderr，由 json-file 限行，容器内不落盘
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-backend-env: &backend-env
  NACOS_ADDR: ${NACOS_ADDR:?要先有 Nacos，业务配置全在里面}
  NACOS_NAME: ${NACOS_NAME:-nacos}
  NACOS_PASSWD: ${NACOS_PASSWD:-}
  NACOS_NS_ID: ${NACOS_NS_ID:-}
  WORKERS: ${WORKERS:-4}

networks:
  dragon-ai:
    external: true

volumes:
  # OpenSandbox 沙箱服务端的持久化（workspace 元数据与文件系统）；
  # 数据目录参数以 opensandbox-server 文档为准，换目录改这里的挂载点
  opensandbox-data:

services:
  gateway:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_gateway
    ports:
      - "${GATEWAY_PORT:-18000}:18000"

  login:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_login
    depends_on:
      - gateway

  system:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_system
    depends_on:
      - gateway

  workflow:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_workflow
    depends_on:
      - gateway

  # 知识库（RAG）服务：配置 CRUD、文档管理、检索、图谱查询、开放 API。
  # ES / Neo4j / OSS 的连接参数不在这里注入，全在 Nacos 的 service_rag 段里（见 init_nacos.yaml）。
  rag:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_rag
    depends_on:
      - gateway

  # 深度探索智能体服务（AgentScope ReAct + OpenSandbox 沙箱）：会话/挂载/
  # SSE 事件流。沙箱与 AgentState 存储的连接参数在 Nacos 的 service_harness
  # 段里（见 sql/init_nacos.yaml），不在镜像里注入。
  harness:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: service_harness
    depends_on:
      - gateway

  # 工作流的异步执行进程。多扩几个实例时给每个不同的 SPLIT_NUMBER（消费不同切片队列），
  # 并把监控页里的「切片数」改成同样的份数，生产端才会把任务轮询到这些队列上。
  arq_workflow:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: arq_workflow
      ARQ_WORKERS: ${ARQ_WORKERS:-4}
      SPLIT_NUMBER: ${SPLIT_NUMBER:-1}

  # 知识库摄取的异步流水线 worker（解析/分块/向量化/媒体理解），纯 CPU。
  # 与 arq_workflow 是两个独立容器组：队列名不同（rag_queue:split_N），
  # 一边排队堆积不会拖死另一边（SPEC §4.1）；图谱构建已拆到下方 arq_graphflow。
  arq_ragflow:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: arq_ragflow
      # 进程数默认比工作流少：摄取任务的重活在 WorkerSettingsRag.max_jobs（读 Nacos）
      ARQ_WORKERS: ${RAG_ARQ_WORKERS:-2}
      SPLIT_NUMBER: ${RAG_SPLIT_NUMBER:-1}
    depends_on:
      - rag

  # 知识图谱构建的独立 worker（graphflow 队列）。图谱逐批走大模型、比文档摄取更耗时，
  # 单独成队后图谱积压不再占用摄取 worker 的并发槽位，两边可各自扩缩容。
  # Redis 与后端配置仍读 Nacos 的 arq_ragflow 段（同一实例），只是队列/worker 名独立。
  arq_graphflow:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: arq_graphflow
      ARQ_WORKERS: ${GRAPH_ARQ_WORKERS:-2}
      SPLIT_NUMBER: ${GRAPH_SPLIT_NUMBER:-1}
    depends_on:
      - rag

  # 深度探索对话轮次的异步 worker（harness_queue:split_N）：每任务占一条
  # 模型流 + 一个用户沙箱会话，与 workflow/ragflow 队列完全隔离、可独立扩
  # 缩容；沙箱是轮次执行期才连的（非启动依赖），opensandbox 后起也能消费。
  arq_harness:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE_NAME: arq_harness
      ARQ_WORKERS: ${HARNESS_ARQ_WORKERS:-2}
      SPLIT_NUMBER: ${HARNESS_SPLIT_NUMBER:-1}
    depends_on:
      - harness

  # OpenSandbox 沙箱服务端（自托管）：深度探索智能体的执行环境（每用户独立
  # workspace，文件跨会话保留）。官方以 PyPI 包发布，这里用 uv 按需拉起；
  # 沙箱连接参数不在这里注入——全在 Nacos 的 service_harness.opensandbox 段
  # （domain 指向本容器：http://opensandbox:8006）。
  # 首次部署先冒烟：docker compose run --rm opensandbox uvx opensandbox-server --help
  # 确认端口/启动参数与 client 大版本匹配（opensandbox 迭代快，两端不一致
  # 会在 workspace 建连时报错）。
#  opensandbox:
#    image: python:3.11-slim
#    command: >
#      sh -c "pip install --no-cache-dir uv
#      && uvx opensandbox-server"
#    networks:
#      - dragon-ai
#    init: true
#    restart: unless-stopped
#    logging:
#      driver: json-file
#      options:
#        max-size: "20m"
#        max-file: "3"
#    volumes:
#      - opensandbox-data:/data
#    ports:
#      - "${OPENSANDBOX_PORT:-8006}:8006"

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: dragon-ai-ui:${TAG:-latest}
    networks:
      - dragon-ai
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      # 走 compose 网络，用服务名访问网关；nginx 只在启动时解析一次，
      # 所以 gateway 必须先起来（depends_on 保证顺序）
      GATEWAY_URL: http://gateway:18000
      LISTEN_PORT: "80"
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - gateway
